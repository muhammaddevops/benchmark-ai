<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  /* dark chart theme, matching the call videos; categorical slots are the validated dark steps */
  .viz-root {
    color-scheme: dark;
    --surface-0: #0b1220; --surface-1: #121b2e; --grid: #22304a; --axis: #2c3b58;
    --text-primary: #eef2f7; --text-secondary: #a8b4c7; --text-muted: #6f7d95;
    --bar: #2fc6b6; --bar-soft: rgba(47,198,182,.32);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --u: 1px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--surface-0); }
  body { font-family: "Inter", "SF Pro Display", -apple-system, system-ui, sans-serif; color: var(--text-primary); overflow: hidden; }
  body.page { overflow: auto; height: auto; }
  .frame { position: relative; width: 100%; height: 100%; padding: calc(64 * var(--u)) calc(80 * var(--u)) calc(56 * var(--u));
    display: grid; grid-template-rows: auto 1fr auto; gap: calc(30 * var(--u));
    background: radial-gradient(1200px 700px at 50% -10%, #16223b 0%, var(--surface-0) 60%); }
  .kicker { font-size: calc(19 * var(--u)); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-secondary); }
  .kicker b { color: var(--bar); }
  h1 { font-size: calc(50 * var(--u)); font-weight: 800; line-height: 1.12; margin-top: calc(10 * var(--u)); letter-spacing: -.01em; }
  .sub { font-size: calc(22 * var(--u)); color: var(--text-secondary); margin-top: calc(10 * var(--u)); line-height: 1.4; }
  .legend { display: flex; flex-wrap: wrap; gap: calc(22 * var(--u)); margin-top: calc(16 * var(--u)); font-size: calc(19 * var(--u)); color: var(--text-secondary); }
  .legend i { display: inline-block; width: calc(16 * var(--u)); height: calc(16 * var(--u)); border-radius: calc(4 * var(--u)); margin-right: calc(8 * var(--u)); vertical-align: calc(-2 * var(--u)); }
  .legend .tick { width: calc(4 * var(--u)); height: calc(20 * var(--u)); border-radius: 2px; background: var(--text-secondary); vertical-align: calc(-4 * var(--u)); }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .lbl { fill: var(--text-primary); font-size: calc(23 * var(--u)); font-weight: 600; }
  .lbl2 { fill: var(--text-muted); font-size: calc(17 * var(--u)); font-weight: 500; }
  .val { fill: var(--text-primary); font-size: calc(23 * var(--u)); font-weight: 700; font-variant-numeric: tabular-nums; }
  .valsm { fill: var(--text-secondary); font-size: calc(17 * var(--u)); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tickl { fill: var(--text-muted); font-size: calc(16 * var(--u)); font-variant-numeric: tabular-nums; }
  .gridl { stroke: var(--grid); stroke-width: 1; }
  .base { stroke: var(--axis); stroke-width: 2; }
  footer { display: flex; justify-content: space-between; gap: calc(20 * var(--u)); font-size: calc(16 * var(--u)); color: var(--text-muted); line-height: 1.45; }
  footer b { color: var(--text-secondary); font-weight: 600; }
  /* interactive page: tooltip + table view */
  .tip { position: fixed; pointer-events: none; background: #000c; color: #fff; border: 1px solid var(--axis); border-radius: 8px;
    padding: 8px 10px; font-size: 14px; line-height: 1.4; display: none; z-index: 20; max-width: 320px; }
  .page-wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .page-wrap .frame { height: 720px; border-radius: 16px; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; color: var(--text-primary); font-size: 14px; margin: 8px 0 40px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--grid); text-align: right; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 600; }
  h2.page { color: var(--text-primary); font-size: 22px; margin: 8px 0; }
  body.square .frame { padding: calc(56 * var(--u)) calc(56 * var(--u)) calc(48 * var(--u)); }
  body.portrait .frame { padding: calc(72 * var(--u)) calc(56 * var(--u)) calc(56 * var(--u)); }
  body.vertical .frame { padding: calc(110 * var(--u)) calc(56 * var(--u)) calc(110 * var(--u)); }
  body.square footer, body.portrait footer, body.vertical footer { flex-direction: column; }
</style>
</head>
<body class="viz-root">
<div class="frame" id="frame">
  <header>
    <div class="kicker" id="kicker"><b>Gulf Voice AI Benchmark</b></div>
    <h1 id="title">Title</h1>
    <div class="sub" id="sub"></div>
    <div class="legend" id="legend"></div>
  </header>
  <div id="plot"><svg id="svg"></svg></div>
  <footer><div id="foot1"></div><div id="foot2"></div></footer>
</div>
<div class="tip" id="tip"></div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  let D = null, C = null, fmt = 'landscape';
  const ease = (p) => 1 - Math.pow(1 - Math.min(1, Math.max(0, p)), 3);

  function el(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  // horizontal bar with a 4px rounded data end, flat at the baseline
  function hbar(g, x0, y, w, h, fill) {
    if (w <= 0.5) return null;
    const r = Math.min(4, h / 2, w);
    const d = `M${x0},${y} H${x0 + w - r} Q${x0 + w},${y} ${x0 + w},${y + r} V${y + h - r} Q${x0 + w},${y + h} ${x0 + w - r},${y + h} H${x0} Z`;
    return el('path', { d, fill }, g);
  }
  function ticks(max, n) {
    const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || raw;
    const out = []; for (let v = 0; v <= max + 1e-9; v += step) out.push(+v.toFixed(6)); return out;
  }
  function tip(e, html) {
    const t = $('tip'); if (!html) { t.style.display = 'none'; return; }
    t.innerHTML = html; t.style.display = 'block';
    t.style.left = Math.min(window.innerWidth - 330, e.clientX + 14) + 'px'; t.style.top = (e.clientY + 14) + 'px';
  }

  // one chart = rows of {label, sub, value(s)}; single-series charts need no legend (the title names the measure)
  function draw(progress) {
    const svg = $('svg'); svg.innerHTML = '';
    const box = $('plot').getBoundingClientRect();
    const W = box.width, H = box.height;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const u = parseFloat(getComputedStyle(document.body).getPropertyValue('--u')) || 1;
    const rows = C.rows, n = rows.length;
    // label column as wide as the longest label (within reason), measured in the real font
    const probe = el('text', { class: 'lbl', x: -9999, y: -9999 }, svg);
    let widest = 0;
    for (const r of rows) {
      probe.setAttribute('class', 'lbl'); probe.textContent = r.label; widest = Math.max(widest, probe.getComputedTextLength());
      if (r.sub) { probe.setAttribute('class', 'lbl2'); probe.textContent = r.sub; widest = Math.max(widest, probe.getComputedTextLength()); }
    }
    probe.remove();
    const labelW = Math.min(widest + 30 * u, W * 0.46);
    const valW = 120 * u;
    const x0 = labelW, x1 = W - valW;
    const series = C.series || [{ key: C.key, color: 'var(--bar)' }];
    const groupGap = (series.length > 1 ? 18 : 14) * u;
    const bandH = (H - 40 * u) / n;
    const barH = Math.min(series.length > 1 ? 20 * u : 40 * u, (bandH - groupGap) / series.length - 2);
    const max = C.max || Math.max(...rows.flatMap((r) => series.map((s) => (r[s.key] ?? 0) * 1)), ...(C.tickKey ? rows.map((r) => r[C.tickKey] ?? 0) : [0])) * 1.05;
    const sx = (v) => (x1 - x0) * (v / max);
    const g = el('g', {}, svg);
    // recessive grid
    for (const t of ticks(max, 4)) {
      const x = x0 + sx(t);
      el('line', { x1: x, x2: x, y1: 0, y2: n * bandH, class: 'gridl' }, g);
      el('text', { x, y: n * bandH + 26 * u, 'text-anchor': 'middle', class: 'tickl' }, g, C.tickFmt ? C.tickFmt(t) : t);
    }
    el('line', { x1: x0, x2: x0, y1: 0, y2: n * bandH, class: 'base' }, g);
    const p = ease(progress);
    rows.forEach((r, i) => {
      const yb = i * bandH + (bandH - (barH * series.length + 2 * (series.length - 1))) / 2;
      el('text', { x: x0 - 18 * u, y: yb + barH * series.length / 2 + (r.sub ? -2 * u : 8 * u), 'text-anchor': 'end', class: 'lbl' }, g, r.label);
      if (r.sub) el('text', { x: x0 - 18 * u, y: yb + barH * series.length / 2 + 22 * u, 'text-anchor': 'end', class: 'lbl2' }, g, r.sub);
      series.forEach((s, k) => {
        const v = r[s.key]; if (v == null) return;
        const y = yb + k * (barH + 2);
        const b = hbar(g, x0, y, sx(v) * p, barH, s.color);
        const label = (s.fmt || C.fmt)(v);
        const hit = el('rect', { x: x0, y: y - 4, width: x1 - x0 + valW, height: barH + 8, fill: 'transparent' }, g);
        hit.addEventListener('mousemove', (e) => tip(e, `<b>${r.label}</b><br>${s.name || C.measure}: ${label}${r.n ? `<br>${r.n} calls` : ''}`));
        hit.addEventListener('mouseleave', (e) => tip(e, null));
        if (p > 0.85 && (series.length === 1 || C.labelAll)) {
          el('text', { x: x0 + sx(v) * p + 12 * u, y: y + barH / 2 + 8 * u * (series.length > 1 ? 0.75 : 1), class: series.length > 1 ? 'valsm' : 'val', opacity: Math.min(1, (p - 0.85) / 0.15) }, g, label);
        }
      });
      if (C.tickKey && r[C.tickKey] != null) {  // slow-end marker (p90) on the same scale
        const x = x0 + sx(r[C.tickKey]) * p;
        el('rect', { x: x - 2, y: yb - 6 * u, width: 4, height: barH + 12 * u, rx: 2, fill: 'var(--text-secondary)', opacity: p > 0.5 ? 1 : 0 }, g);
      }
    });
  }

  window.setup = function (data, chartId, format) {
    D = data; fmt = format || 'landscape';
    C = D.charts.find((c) => c.id === chartId);
    for (const k of ['fmt', 'tickFmt']) if (typeof C[k] === 'string') C[k] = new Function('v', 'return ' + C[k]);
    (C.series || []).forEach((s) => { if (typeof s.fmt === 'string') s.fmt = new Function('v', 'return ' + s.fmt); });
    document.body.className = 'viz-root ' + fmt;
    const base = { landscape: 1920, square: 1080 / 0.72, portrait: 1080 / 0.8, vertical: 1080 / 0.85, page: 1920 }[fmt] || 1920;
    document.documentElement.style.setProperty('--u', (window.innerWidth / base) + 'px');
    document.querySelector('.viz-root').style.setProperty('--u', (window.innerWidth / base) + 'px');
    $('kicker').innerHTML = '<b>' + (D.brand || 'Gulf Voice AI Benchmark') + '</b>' + (D.kicker ? ' · ' + D.kicker : '');
    $('title').textContent = C.title;
    $('sub').textContent = C.sub || '';
    const lg = $('legend'); lg.innerHTML = '';
    if (C.series && C.series.length > 1) for (const s of C.series) lg.insertAdjacentHTML('beforeend', `<span><i style="background:${s.color}"></i>${s.name}</span>`);
    if (C.tickKey) lg.insertAdjacentHTML('beforeend', `<span><i class="tick"></i>${C.tickName}</span>`);
    $('foot1').innerHTML = D.foot1 || '';
    $('foot2').innerHTML = D.foot2 || '';
    return document.fonts.ready.then(() => { draw(1); return true; });
  };
  window.render = function (progress) { draw(progress); return true; };
})();
</script>
</body>
</html>
