notes:
- Snapshot taken 2026-11-10. Vendor accuracy claims (Munsit, Nabrah, Unifonic, Maqsam, Intella, Jais-ASR, Cohere, TII) are
  self-reported; our benchmark is the independent check.
- 'Only providers with self-serve API access and streaming STT/TTS can be tested reproducibly inside the LiveKit harness:
  HUMAIN Voice (if self-serve holds), Munsit, Nabrah, Sarj, Hamsa, Fanar (quota-limited), CAMB.AI, plus all global vendors.
  Maqsam, Unifonic, Dayl, Hams.AI, ZIWO, Arabic.AI, Wittify, Sawt are sales/pilot-only phone agents.'
- 'Phone-only platforms (Maqsam, Vapi, Retell, Nabrah/Hamsa agents, Sarj outbound) need a LiveKit SIP trunk (Twilio is already
  in .env). Report them in a separate ''phone'' bracket: PSTN adds latency and narrows audio to 8 kHz, so mixing them with
  WebRTC stacks on one latency chart would be unfair.'
- Project memory says LiveKit Inference credits are exhausted; prefer direct plugins with vendor keys (livekit-plugins-*)
  over Inference model strings for new stacks.
- 'Official/3rd-party LiveKit plugins relevant to Arabic: openai, google, azure, microsoft-ai, aws, deepgram, speechmatics,
  soniox, gladia, assemblyai, cartesia, elevenlabs, xai, mistralai, cambai, telnyx, ultravox, bland, nabrah (official, STT),
  munsit (CNTXT, STT+TTS), faseeh (legacy). No plugin: HUMAIN Voice, Sarj, Hamsa, Fanar, Lahajati, Cohere -> write stacks/custom
  factories (Sarj and Fanar can reuse livekit-plugins-openai with base_url).'
- 'Do not confuse: Pipecat''s ''inception'' service is Inception Labs (US, Mercury diffusion LLM), not G42/Inception42 Jais.
  Hamsa (tryhamsa.com) is not Hams.AI (Riyadh). Telnyx ''Bayan'' TTS is unrelated to HUMAIN''s ''Bayan'' ASR as far as I
  can tell.'
- 'Dropped or demoted after checking: Mozn (Saudi; NLU ''OSOS'' and AML ''FOCAL'', no voice product found), Presight (UAE;
  analytics, no voice product found), Core42 (Jais Chat app; no voice API found), Hume (APIs sunset 13 Nov 2026), NeuralSpace
  (no 2026 activity found), Falcon-ASR (announced Oct 2026, no weights or API yet).'
- 'Seen but not verified enough to include: Kalimna AI, DOO (Bahrain), Zain Bahrain OneCX (Bahraini-dialect voice agent),
  KuwaitAI, AethexAI ($3M), Lucidya agent, Kanari AI, Fenek AI, Nevox AI, Clearvision (KSA), Edesy. Aggregator sites arabicagenticai.pages.dev
  and ai-in-arabia-v2.pages.dev look auto-generated; their claims were not used as facts.'
- 'Useful public yardsticks for the video: Open Universal Arabic ASR Leaderboard (Elm) https://github.com/Natural-Language-Processing-Elm/open_universal_arabic_asr_leaderboard
  ; SawtArabi TTS benchmark (HUMAIN/SDAIA, Interspeech 2025) https://www.middleeastainews.com/p/humain-sawtarabi-arabic-tts-benchmark
  ; Nabrah cites the SADA benchmark.'
- 'Regional hosting matters for latency: AWS me-central-1 (UAE) and a Saudi region slated for Dec 2026; Munsit has a UAE
  server (ae.api.faseeh.ai); HUMAIN and Nabrah host in KSA. The harness routes LiveKit to the UAE gateway, so local vendors
  may look faster partly for geographic reasons; note this on screen.'
- 'This Mac: Apple M4 Pro, 24 GB RAM, Ollama 0.40.15 installed (falcon3:7b, qwen3:8b, qwen3:14b present). 7-9B Q4 Arabic
  LLMs are comfortable; 27B+ Q4 are tight.'
- 'Licences: CC-BY-NC models (Command R7B Arabic, Habibi, NAMAA-Saudi-TTS-V2) are fine for a benchmark but not for the resellable
  avatar product.'
