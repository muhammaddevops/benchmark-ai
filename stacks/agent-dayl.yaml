# Dayl voice agent, tested as a black box over the phone (domestic). How to get a number: pilot number.
# Set it up with `bench brief <scenario>`, put its number in .env as DAYL_AGENT_NUMBER, needs BENCH_SIP_TRUNK_ID once.
name: Dayl voice agent (phone)
display: Dayl (UAE)
display_sub: hosted agent · via phone
provider: dayl
kind: phone
phone: {number_env: DAYL_AGENT_NUMBER, trunk_env: BENCH_SIP_TRUNK_ID}
notes: Black box over the phone network (adds ~0.3-0.6 s and narrowband audio). Record the platform's voice, model and language
  settings here before publishing.
