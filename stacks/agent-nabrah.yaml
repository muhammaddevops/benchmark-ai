# Nabrah voice agent, tested as a black box over the phone (domestic). How to get a number: self-serve agents with SIP.
# Set it up with `bench brief <scenario>`, put its number in .env as NABRAH_AGENT_NUMBER, needs BENCH_SIP_TRUNK_ID once.
name: Nabrah voice agent (phone)
