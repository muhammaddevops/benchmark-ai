# Jais 3 7B (UAE, MBZUAI IFM) as the brain, everything else identical to the all-local baseline
# (Whisper turbo STT + macOS voices on this Mac). Pull once: ollama pull hf.co/IFM/Jais-3-7B-GGUF:Q4_K_M
name: Whisper turbo (local) · Jais 3 7B (local) · macOS voices
display: Jais 3 7B · UAE (reasoning)
display_sub: Jais 3 7B on a Mac · local speech
provider: local (jais-3-7b)
kind: pipeline
stt: {plugin: localspeech}
llm: {plugin: ollama, model: 'hf.co/IFM/Jais-3-7B-GGUF:Q4_K_M', max_tokens: 1500, think: true}
tts: {plugin: localspeech, voice: auto}
turn_detection: turn-detector
notes: 'Jais 3 is a reasoning model: its chat template always thinks before answering (no off switch in the
  GGUF template; an empty-think prefill made it reason in the reply instead), so it runs as shipped with a larger
  token budget. Expect long pauses; the reasoning is not spoken. Q4_K_M on an M4 Pro.'
