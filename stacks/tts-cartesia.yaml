# Cartesia Sonic-3 (US), Arabic. Key: CARTESIA_API_KEY. Default voice; set voice: <id> for an Arabic one.
# TTS swap of ref-pipeline.
name: Scribe v2 RT · GPT-5.4 mini · Sonic-3 Arabic
display: Cartesia TTS
display_sub: Sonic-3 Arabic · ref STT + LLM
provider: elevenlabs + openai + cartesia
kind: pipeline
stt:
  plugin: elevenlabs
  model: scribe_v2_realtime
  extra:
    server_vad: {vad_silence_threshold_secs: 0.6}
llm: {plugin: openai, model: gpt-5.4-mini}
tts: {plugin: cartesia, model: sonic-3.6, language: ar, kwargs: {word_timestamps: false}}
turn_detection: turn-detector
notes: 'TTS test: only the TTS differs from ref-pipeline.'
