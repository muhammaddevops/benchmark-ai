# Google Cloud TTS Chirp 3 HD Arabic. Needs GOOGLE_APPLICATION_CREDENTIALS.
# TTS swap of ref-pipeline.
name: Scribe v2 RT · GPT-5.4 mini · Chirp 3 HD ar-XA
display: Google TTS
display_sub: Chirp 3 HD ar-XA · ref STT + LLM
provider: elevenlabs + openai + google
kind: pipeline
stt:
  plugin: elevenlabs
  model: scribe_v2_realtime
  extra:
    server_vad: {vad_silence_threshold_secs: 0.6}
llm: {plugin: openai, model: gpt-5.4-mini}
tts: {plugin: google, voice: ar-XA-Chirp3-HD-Charon, language: ar-XA}
turn_detection: turn-detector
notes: 'TTS test: only the TTS differs from ref-pipeline.'
requires: [GOOGLE_APPLICATION_CREDENTIALS]
