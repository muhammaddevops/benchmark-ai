# HUMAIN Voice TTS Nebula (first listed voice unless options.voice is set), via bench/adapters/humain.py.
# Keys: HUMAIN_VOICE_API_KEY + HUMAIN_VOICE_API_URL.
# TTS swap of ref-pipeline.
name: Scribe v2 RT · GPT-5.4 mini · HUMAIN Nebula
display: HUMAIN TTS (Saudi)
display_sub: HUMAIN Nebula · ref STT + LLM
provider: elevenlabs + openai + humain
kind: pipeline
stt:
  plugin: elevenlabs
  model: scribe_v2_realtime
  extra:
    server_vad: {vad_silence_threshold_secs: 0.6}
llm: {plugin: openai, model: gpt-5.4-mini}
tts:
  plugin: custom
  factory: bench.adapters.humain:tts_factory
  options: {model: nebula}
turn_detection: turn-detector
notes: 'TTS test: only the TTS differs from ref-pipeline. Set options.voice to a Saudi voice id from list_voices().'
requires: [HUMAIN_VOICE_API_KEY, HUMAIN_VOICE_API_URL]
