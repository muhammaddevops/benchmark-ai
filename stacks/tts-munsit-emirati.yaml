# Faseeh TTS by Munsit, Emirati voice and dialect. Key: MUNSIT_API_KEY.
# TTS swap of ref-pipeline.
name: Scribe v2 RT · GPT-5.4 mini · Faseeh v1 · Emirati male
display: Munsit TTS Emirati
display_sub: Faseeh v1 · Emirati male · ref STT + LLM
provider: elevenlabs + openai + munsit
kind: pipeline
stt:
